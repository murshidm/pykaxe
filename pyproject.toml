[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pykaxe"
dynamic = ["version"]
description = "A terminal UI for discovering and running small Python CLI tools."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Murshid", email = "murshidm@gmail.com" }]
keywords = ["tui", "cli", "textual", "terminal", "tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Terminals",
]
dependencies = [
    # >=0.86 required for the Theme system (App.register_theme/App.theme,
    # textual.theme.Theme) used in app.py to register PYKAXE_THEME —
    # confirmed against Textual's own CHANGELOG.md ([0.86.0], 2024-11-16).
    "textual>=0.86",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/murshidm/pykaxe"
Issues = "https://github.com/murshidm/pykaxe/issues"

[project.scripts]
pykaxe = "pykaxe.cli:main"

[project.optional-dependencies]
dev = [
    "build",
    "twine",
    "pytest",
    "ruff",
]

[tool.hatch.version]
path = "src/pykaxe/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pykaxe"]

[tool.hatch.build.targets.sdist]
include = [
    "src/pykaxe",
    "tests",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F"]
